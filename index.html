<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="草地打滚的小熊：滚动小熊，收集蜂蜜草莓，躲开石头和小蜜蜂！">
<meta property="og:title" content="草地打滚的小熊 🐻">
<meta property="og:description" content="在软软的草地上滚来滚去，收集蜂蜜和草莓，躲开石头和小蜜蜂！">
<title>草地打滚的小熊 🐻</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; position:fixed; overscroll-behavior:none;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:#87c9f0; user-select:none; -webkit-user-select:none; }
  #stage { position:relative; width:100%; height:100%; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  /* ---------- HUD ---------- */
  #hud { position:absolute; top:0; left:0; right:0; z-index:5;
    padding:calc(10px + env(safe-area-inset-top)) 14px 0; pointer-events:none; }
  #hud.hidden { display:none; }
  #hud .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .pill { background:rgba(255,255,255,0.88); border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,0.18); padding:7px 12px; display:flex; align-items:center; gap:8px; }
  .energy { flex:1; max-width:240px; min-width:150px; }
  .energy .eico { font-size:18px; }
  .ebar { flex:1; height:14px; background:#e8e2d4; border-radius:999px; overflow:hidden; }
  #efill { height:100%; width:100%; border-radius:999px;
    background:linear-gradient(90deg,#ffd23f,#ff9d2e);
    transition:width .15s linear; }
  #meters, #honeyc { font-weight:800; color:#5a3b1f; font-size:16px; white-space:nowrap; }
  .hudbtn { pointer-events:auto; border:none; background:rgba(255,255,255,0.88); border-radius:999px;
    width:42px; height:42px; font-size:19px; box-shadow:0 3px 10px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .hudbtn:active { transform:scale(0.92); }
  #hud .right { display:flex; align-items:center; gap:8px; }
  .jumpbtn { position:absolute; right:20px; bottom:calc(36px + env(safe-area-inset-bottom)); z-index:6;
    width:76px; height:76px; border-radius:50%; border:3px solid #ffb03a;
    background:rgba(255,255,255,0.92); color:#8a4a1d; font-size:26px; font-weight:900;
    box-shadow:0 6px 16px rgba(0,0,0,0.28); display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:none; }
  .jumpbtn:active { transform:scale(0.9); background:#ffe9c2; }
  .jumpbtn.hidden { display:none; }
  #steer { position:absolute; left:16px; bottom:calc(36px + env(safe-area-inset-bottom)); z-index:6;
    display:flex; gap:14px; }
  #steer.hidden { display:none; }
  #camBox { position:absolute; right:12px; top:calc(64px + env(safe-area-inset-top)); z-index:6;
    border-radius:12px; overflow:hidden; border:2px solid rgba(255,255,255,0.9);
    box-shadow:0 6px 16px rgba(0,0,0,0.3); background:#222; }
  #camBox.hidden { display:none; }
  #camPreview { display:block; width:160px; height:120px; }
  .steerbtn { width:76px; height:76px; border-radius:50%; border:3px solid #7fc95a;
    background:rgba(255,255,255,0.9); color:#4a7a2d; font-size:30px; font-weight:900;
    box-shadow:0 6px 16px rgba(0,0,0,0.28); cursor:pointer; touch-action:none;
    user-select:none; -webkit-user-select:none; }
  .steerbtn:active { transform:scale(0.9); background:#e8f7dd; }

  /* ---------- 弹层 ---------- */
  .overlay { position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:rgba(43,78,30,0.30); padding:20px; }
  .overlay.hidden { display:none; }
  .card { background:rgba(255,255,255,0.95); border-radius:26px; padding:28px 24px 30px;
    text-align:center; max-width:min(88vw,370px); box-shadow:0 18px 44px rgba(0,0,0,0.30);
    animation:pop .35s ease-out; }
  @keyframes pop { from{ transform:scale(0.86); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .card h1 { font-size:26px; color:#5a3b1f; margin:6px 0 10px; letter-spacing:1px; }
  .card .bear { font-size:86px; line-height:1.1; animation:bounce 1.4s ease-in-out infinite; display:inline-block; }
  @keyframes bounce { 0%,100%{ transform:translateY(0) rotate(-10deg); } 50%{ transform:translateY(-16px) rotate(10deg); } }
  .sub { color:#7a5a38; font-size:15px; line-height:1.7; margin-bottom:12px; }
  .hint { color:#a08563; font-size:13px; line-height:1.8; margin-bottom:18px; }
  .btn { display:inline-block; font-size:20px; font-weight:800; color:#fff; border:none; cursor:pointer;
    background:linear-gradient(135deg,#ffb03a,#ff7a18); border-radius:999px; padding:14px 42px;
    box-shadow:0 6px 0 #d9640f, 0 12px 22px rgba(0,0,0,0.25); letter-spacing:2px; }
  .btn:active { transform:translateY(5px); box-shadow:0 1px 0 #d9640f; }
  .btn.small { font-size:15px; padding:11px 26px; letter-spacing:1px; margin-top:12px;
    background:linear-gradient(135deg,#5ac8fa,#2f7cf6); box-shadow:0 5px 0 #1f5cb8, 0 10px 18px rgba(0,0,0,0.22); }
  .btn.small:active { transform:translateY(4px); box-shadow:0 1px 0 #1f5cb8; }
  #finalStats { color:#6b4b2a; font-size:16px; line-height:2; margin:6px 0 18px; }
  #finalStats .big { font-size:26px; font-weight:800; color:#e0701a; }
  #menuBest { margin-top:14px; color:#b08a5c; font-size:13px; }
  .record { color:#e04f3f; font-weight:800; }
  .tip { margin-top:16px; color:#9c825f; font-size:12px; }
  .ver { margin-top:10px; color:#b8a78c; font-size:11px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="row">
      <div class="pill energy">
        <span class="eico">🍯</span>
        <div class="ebar"><div id="efill"></div></div>
      </div>
      <div class="right">
        <div id="powerHud" class="pill hidden"><span id="powerIcon">⭐</span><span id="powerT">3s</span></div>
        <div class="pill"><span id="meters">0 米</span></div>
        <div class="pill"><span id="honeyc">🍯×0</span></div>
        <button id="btnMute" class="hudbtn">🔊</button>
        <button id="btnPause" class="hudbtn">⏸</button>
        <button id="btnCam" class="hudbtn">📷</button>
      </div>
    </div>
  </div>

  <div id="camBox" class="hidden">
    <canvas id="camPreview" width="160" height="120"></canvas>
  </div>
  <video id="camVideo" autoplay playsinline muted style="display:none"></video>

  <div id="steer" class="hidden">
    <button id="btnLeft" class="steerbtn">◀</button>
    <button id="btnRight" class="steerbtn">▶</button>
  </div>
  <button id="btnJump" class="jumpbtn hidden">跳!</button>

  <div id="menu" class="overlay">
    <div class="card">
      <span class="bear">🐻</span>
      <h1>草地打滚的小熊</h1>
      <p class="sub">在软软的草地上滚来滚去～<br>收集 🍯 和 🍓 补充体力，<br>躲开大石头、滚石和捣蛋的小蜜蜂！</p>
      <p class="hint">🕹️ 左下角 <b>◀ ▶</b> 按钮控制方向<br>🔘 右下角「跳!」跳跃（空中再点 = 二段跳）<br>📷 点右上角相机 = 摄像头手指体感<br>　（手指左右移动转向 · 向上一挑跳跃）<br>⚠️ 红色 <b>!</b> / 白色弧线 = 起跳时机<br>🖥 电脑：← → 方向，空格跳跃</p>
      <button id="btnStart" class="btn">开始打滚 🐾</button>
      <div id="menuBest"></div>
      <div id="menuAch" class="ver"></div>
      <div class="ver">v6 · 体感版（手指骨骼识别操控）</div>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="card">
      <span class="bear">☁️</span>
      <h1>休息一下</h1>
      <p class="sub">小熊在草地里打了个盹～</p>
      <button id="btnResume" class="btn">继续滚 🔄</button>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <span class="bear">😵</span>
      <h1 id="overTitle">滚不动啦～</h1>
      <div id="finalStats"></div>
      <button id="btnRestart" class="btn">再滚一次 🔄</button>
      <button id="btnCopy" class="btn small">📋 复制成绩，去炫耀!</button>
      <div class="tip">TIP：空中再点一次可以二段跳哦～ 🌈</div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 基础设置 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, scale = 1;
const VIEW_H = 540;                 // 竖向可见的世界高度（世界单位）
let viewW = 960, viewH = VIEW_H;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  scale = H / VIEW_H;
  viewH = VIEW_H;
  viewW = W / scale;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 60); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ================= 工具函数 ================= */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function hexLerp(c1, c2, t){
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = ((a >> 16) + (((b >> 16) - (a >> 16)) * t)) | 0;
  const g = (((a >> 8) & 255) + ((((b >> 8) & 255) - ((a >> 8) & 255)) * t)) | 0;
  const bl = ((a & 255) + (((b & 255) - (a & 255)) * t)) | 0;
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function hash(n){                                  // 确定性伪随机
  n = Math.imul(n | 0, 374761393) + 668265263;
  n = Math.imul((n ^ (n >>> 13)), 1274126177);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function rrect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function vibrate(ms){ try{ if (navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ================= 音效 ================= */
let actx = null, muted = false;
try { muted = localStorage.getItem('bearMute') === '1'; } catch(e){}
function ensureAudio(){
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
}
function tone(f0, f1, dur, type, vol, when){
  if (muted || !actx) return;
  const t0 = actx.currentTime + (when || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
let noiseBuf = null;
function noise(dur, vol, fc){
  if (muted || !actx) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.4, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0 + dur + 0.05);
}
function sfx(name){
  switch (name) {
    case 'start': tone(523,523,.10,'sine',.22); tone(659,659,.10,'sine',.22,.08); tone(784,784,.18,'sine',.25,.16); break;
    case 'berry': tone(880,880,.09,'sine',.22); tone(1175,1175,.13,'sine',.20,.07); break;
    case 'honey': tone(659,659,.10,'triangle',.26); tone(880,880,.10,'triangle',.26,.09); tone(1319,1319,.18,'triangle',.28,.18); break;
    case 'bump':  tone(110,52,.18,'triangle',.45); noise(.12,.3,320); break;
    case 'splash': noise(.32,.25,900); break;
    case 'jump':  tone(280,560,.16,'sine',.22); break;
    case 'land':  tone(130,70,.09,'triangle',.18); noise(.08,.15,400); break;
    case 'sting': tone(250,90,.30,'sawtooth',.26); break;
    case 'over':  tone(392,392,.20,'sine',.26); tone(330,330,.20,'sine',.26,.22); tone(262,262,.45,'sine',.26,.44); break;
    case 'djump': tone(500,950,.14,'sine',.24); break;
    case 'star':  tone(784,784,.08,'triangle',.22); tone(988,988,.08,'triangle',.22,.07); tone(1175,1175,.14,'triangle',.24,.14); break;
    case 'magnet': tone(660,990,.12,'sawtooth',.15); break;
    case 'clover': tone(523,523,.10,'sine',.20); tone(659,659,.10,'sine',.20,.08); tone(784,784,.16,'sine',.22,.16); break;
    case 'bfly':  tone(1200,1700,.12,'sine',.18); break;
    case 'ach':   tone(784,784,.10,'triangle',.22); tone(988,988,.10,'triangle',.22,.09); tone(1319,1319,.20,'triangle',.24,.18); break;
    case 'heart': tone(95,60,.10,'sine',.26); tone(75,50,.12,'sine',.20,.15); break;
  }
}

/* ================= 背景音乐（音乐盒） ================= */
const MELODY = [
  [659,1],[784,1],[880,1],[784,1],[659,1],[784,1],[880,1],[1047,2],
  [988,1],[880,1],[784,1],[880,1],[784,1],[659,1],[587,1],[659,2],
  [523,1],[659,1],[784,1],[659,1],[880,1],[784,1],[659,1],[523,2],
  [587,1],[659,1],[698,1],[587,1],[659,1],[587,1],[523,1],[523,2]
];
let musicTimer = null;
function scheduleMusic(){
  if (!actx || muted) return;
  const t0 = actx.currentTime + 0.05;
  let t = 0;
  for (let i = 0; i < MELODY.length; i++) {
    const n = MELODY[i];
    tone(n[0], n[0], n[1] * 0.21, 'triangle', 0.10, t);
    tone(n[0] / 2, n[0] / 2, n[1] * 0.21, 'sine', 0.05, t);
    t += n[1] * 0.22;
  }
  musicTimer = setTimeout(scheduleMusic, Math.max(200, t * 1000 - 300));
}
function startMusic(){ stopMusic(); if (muted) return; ensureAudio(); if (actx) scheduleMusic(); }
function stopMusic(){ if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; } }

/* ================= 世界与地形 ================= */
function terrainY(x){
  return VIEW_H * 0.70
    + Math.sin(x * 0.0040) * 26
    + Math.sin(x * 0.0016 + 1.3) * 20
    + Math.sin(x * 0.0008 + 4.0) * 8;
}
function slopeAt(x){
  const e = 2;
  return (terrainY(x + e) - terrainY(x - e)) / (2 * e);
}
function flowerExists(i){ return hash(i * 7 + 3) < 1 / 6; }
function overGap(x){
  for (let i = 0; i < gaps.length; i++) {
    if (x > gaps[i].x && x < gaps[i].x + gaps[i].w) return true;
  }
  return false;
}
function inGap(x){
  for (let i = 0; i < gaps.length; i++) {
    if (x > gaps[i].x - 30 && x < gaps[i].x + gaps[i].w + 30) return true;
  }
  return false;
}
function comboMult(){ return Math.min(10, Math.max(1, combo)); }
function comboHit(){
  combo++; comboTime = 3.5;
  if (combo > stats.bestCombo) stats.bestCombo = combo;
  if (combo === 3) addToast('太棒了! 🔥');
  else if (combo === 5) addToast('超厉害! ✨');
  else if (combo === 8) addToast('无敌小熊! 👑');
  else if (combo === 10) addToast('连击封神! 🌟');
}
function comboBreak(){ if (combo >= 2) comboBreakT = 1.4; combo = 0; }
function addFloat(x, y, text, color){
  floats.push({ x: x, y: y, text: text, color: color, life: 1.1, max: 1.1 });
}
function addToast(text){ toastTxt = text; toastT = 2.0; }

/* ================= 游戏状态 ================= */
const R = 30;            // 小熊半径
const MAXS = 560;        // 最大速度
const ACC = 560;         // 加速度
const STARTX = 60;       // 起点（米 = (x-STARTX)/48）

const state = {
  mode: 'menu',          // menu | playing | paused | over
  t: 0,                  // 渲染用时间
  simT: 0,               // 游戏内时间（暂停时冻结）
  best: 0
};
try { state.best = parseInt(localStorage.getItem('bearBest') || '0', 10) || 0; } catch(e){}

/* ================= 成就系统 ================= */
const ACH = [
  { id:'firstRoll', name:'初次打滚', desc:'单局滚出 10 米', icon:'🌱', check:function(s){ return s.bestRunMeters >= 10; } },
  { id:'flowers',   name:'压花小能手', desc:'累计压花 50 朵', icon:'🌸', check:function(s){ return s.totalFlowers >= 50; } },
  { id:'jumps',     name:'跳跃之星',   desc:'累计跳跃 100 次', icon:'⭐', check:function(s){ return s.totalJumps >= 100; } },
  { id:'combo10',   name:'连击大师',   desc:'单局连击达到 ×10', icon:'🔥', check:function(s){ return s.bestCombo >= 10; } },
  { id:'honey20',   name:'蜂蜜收藏家', desc:'累计收集 20 罐蜂蜜', icon:'🍯', check:function(s){ return s.totalHoney >= 20; } },
  { id:'run500',    name:'飞毛腿',     desc:'单局滚出 500 米', icon:'🏃', check:function(s){ return s.bestRunMeters >= 500; } },
  { id:'run1000',   name:'草地之王',   desc:'单局滚出 1000 米', icon:'👑', check:function(s){ return s.bestRunMeters >= 1000; } }
];
let stats = { totalFlowers:0, totalJumps:0, totalHoney:0, bestCombo:0, bestRunMeters:0, ach:[] };
try {
  const s = JSON.parse(localStorage.getItem('bearStats') || 'null');
  if (s) stats = Object.assign(stats, s);
} catch(e){}
function saveStats(){ try { localStorage.setItem('bearStats', JSON.stringify(stats)); } catch(e){} }
function checkAch(){
  let got = false;
  for (let i = 0; i < ACH.length; i++) {
    const a = ACH[i];
    if (stats.ach.indexOf(a.id) < 0 && a.check(stats)) {
      stats.ach.push(a.id);
      newAch.push(a);
      addToast('🏅 成就解锁：' + a.name + '!');
      sfx('ach');
      got = true;
    }
  }
  if (got) saveStats();
}

let bear, honey, picked, playTime, lastFi, meters;
let combo, comboTime, comboBreakT, points, score, coyote, jumpBuf;
let items, rocks, puddles, boulders, gaps, trail, marks, ps, bees;
let powers, powerTimer, butterflies, bflyTimer, heartTimer, newAch, lastResult;
let nextItemX, nextRockX, nextPuddleX, nextGapX, spawnCount, beeTimer, boulderTimer;
let camX = 0, camY = 0, shake = 0;
let eyeMode = 'idle';
let floats = [];
let toastTxt = null, toastT = 0, recordShown = false, metersMilestone = 0;
const clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({ x: Math.random() * 1600, y: 60 + Math.random() * 130, s: 0.7 + Math.random() * 0.8, v: 8 + Math.random() * 10 });
}

function resetGame(){
  bear = { x: STARTX, y: 0, vx: 0, vy: 0, airborne: false, falling: false, overGapT: 0, squash: 0, stretch: 0,
    jumps: 0, starT: 0, magnetT: 0, shieldT: 0, angle: 0, energy: 100, groundY: terrainY(STARTX) };
  honey = 0;
  picked = new Set();
  playTime = 0;
  lastFi = null;
  meters = 0;

const pointers = new Map();
const keys = new Set();
const btnDirs = { left: false, right: false };

if (window.PointerEvent) {
  canvas.addEventListener('pointerdown', function(e){
    ensureAudio();
    if (state.mode === 'playing') {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now() });
    }
  });
  canvas.addEventListener('pointerup', function(e){
    const p = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    if (p && performance.now() - p.t < 300 &&
        Math.abs(e.clientX - p.x) < 26 && Math.abs(e.clientY - p.y) < 26) tryJump();
  });
  canvas.addEventListener('pointercancel', function(e){ pointers.delete(e.pointerId); });
} else {
  const byId = {};
  canvas.addEventListener('touchstart', function(e){
    ensureAudio();
    if (state.mode !== 'playing') return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      byId[t.identifier] = { x: t.clientX, y: t.clientY, t: performance.now() };
    }
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', function(e){
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const p = byId[t.identifier];
      delete byId[t.identifier];
      if (p && performance.now() - p.t < 300 &&
          Math.abs(t.clientX - p.x) < 26 && Math.abs(t.clientY - p.y) < 26) tryJump();
    }
    e.preventDefault();
  }, { passive: false });
}
function bindSteer(btn, dir){
  btn.addEventListener('pointerdown', function(e){ e.preventDefault(); ensureAudio(); btnDirs[dir] = true; });
  btn.addEventListener('pointerup', function(e){ e.preventDefault(); btnDirs[dir] = false; });
  btn.addEventListener('pointercancel', function(){ btnDirs[dir] = false; });
  btn.addEventListener('pointerleave', function(){ btnDirs[dir] = false; });
  btn.addEventListener('touchstart', function(e){ e.preventDefault(); ensureAudio(); btnDirs[dir] = true; }, { passive: false });
  btn.addEventListener('touchend', function(e){ e.preventDefault(); btnDirs[dir] = false; }, { passive: false });
  btn.addEventListener('touchcancel', function(){ btnDirs[dir] = false; });
}
bindSteer(document.getElementById('btnLeft'), 'left');
bindSteer(document.getElementById('btnRight'), 'right');
window.addEventListener('keydown', function(e){
  if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' ||
      e.code === 'KeyA' || e.code === 'KeyD' || e.code === 'KeyW' || e.code === 'Space') e.preventDefault();
  if (!e.repeat && (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space')) tryJump();
  keys.add(e.code);
});
window.addEventListener('keyup', function(e){ keys.delete(e.code); });

function getInputDir(){
  let d = 0;
  if (btnDirs.left) d -= 1;
  if (btnDirs.right) d += 1;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) d -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) d += 1;
  if (camOn) d += camDir;   // 摄像头手指体感
  return d === 0 ? 0 : (d > 0 ? 1 : -1);
}

const camVideo = document.getElementById('camVideo');
let camOn = false, camStream = null, camTimer = null;

function stopCam(){
  camOn = false; camDir = 0; camTip = null; camCrossArmed = false;
  if (camTimer) { clearInterval(camTimer); camTimer = null; }
  if (camStream) {
    try { camStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
    camStream = null;
  }
  try { camVideo.srcObject = null; } catch(e){}
  document.getElementById('camBox').classList.add('hidden');
  document.getElementById('btnCam').textContent = '📷';
}
async function loadHands(){
  if (camHands || camLoading) return;
  camLoading = true;
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    try {
      camHands = await vision.HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: 'models/hand_landmarker.task', delegate: 'GPU' },
        runningMode: 'VIDEO',
        numHands: 1
      });
    } catch(eGpu) {
      camHands = await vision.HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: 'models/hand_landmarker.task', delegate: 'CPU' },
        runningMode: 'VIDEO',
        numHands: 1
      });
    }
    addToast('📷 手指识别就绪：指尖左右移动转向 · 上挑跳跃');
  } catch(e) {
    camHands = 'fallback';

function toggleCam(){
  if (camOn) { stopCam(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    addToast('📷 此浏览器不支持摄像头（微信内请用系统浏览器打开）');
    return;
  }
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 } },
    audio: false
  }).then(function(stream){
    camStream = stream;
    camVideo.srcObject = stream;
    return camVideo.play();
  }).then(function(){
    camOn = true; camCrossArmed = false; camPrevGray = null; camTip = null;
    document.getElementById('camBox').classList.remove('hidden');

const HAND_LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function camDrawHand(pctx, lm){
  const w = pctx.canvas.width, h = pctx.canvas.height;
  pctx.strokeStyle = 'rgba(255,255,255,0.85)';
  pctx.lineWidth = 1.6;
  for (let i = 0; i < HAND_LINKS.length; i++) {
    const a = lm[HAND_LINKS[i][0]], b = lm[HAND_LINKS[i][1]];
    pctx.beginPath();
    pctx.moveTo((1 - a.x) * w, a.y * h);
    pctx.lineTo((1 - b.x) * w, b.y * h);
    pctx.stroke();
  }
  pctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < lm.length; i++) {
    pctx.beginPath();
    pctx.arc((1 - lm[i].x) * w, lm[i].y * h, 2.2, 0, Math.PI * 2);
    pctx.fill();
  }
}
function frameDiffTip(){
  if (!camBuf) {
    camBuf = document.createElement('canvas');
    camBuf.width = 64; camBuf.height = 48;
    camBufCtx = camBuf.getContext('2d');
  }
  camBufCtx.save();
  camBufCtx.translate(64, 0); camBufCtx.scale(-1, 1);
  camBufCtx.drawImage(camVideo, 0, 0, 64, 48);
  camBufCtx.restore();
  let img;
  try { img = camBufCtx.getImageData(0, 0, 64, 48); } catch(e){ return null; }
  const d = img.data;
  const gray = new Float32Array(64 * 48);
  for (let i = 0; i < 64 * 48; i++) gray[i] = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3;
  let tip = null;
  if (camPrevGray) {
    let sx = 0, sy = 0, sw = 0;
    for (let y = 2; y < 46; y++) for (let x = 2; x < 62; x++) {
      const i = y * 64 + x;
      const diff = Math.abs(gray[i] - camPrevGray[i]);
      if (diff > 20) { const w = diff; sx += x * w; sy += y * w; sw += w; }
    }
    if (sw > 80) tip = { x: sx / sw / 64, y: sy / sw / 48 };
  }
  camPrevGray = gray;
  return tip;
}
function camProcess(){
  if (!camOn || !camVideo || camVideo.readyState < 2) return;
  const pv = document.getElementById('camPreview');
  const pctx = pv.getContext('2d');
  const now = performance.now();
  let tip = null;
  if (camHands && camHands !== 'fallback') {
    try {
      const res = camHands.detectForVideo(camVideo, now);
      if (res.landmarks && res.landmarks.length) {
        tip = { x: 1 - res.landmarks[0][8].x, y: res.landmarks[0][8].y };
        camDrawHand(pctx, res.landmarks[0]);
      }
    } catch(e){}
  } else if (camHands === 'fallback') {
    tip = frameDiffTip();
  }
  if (tip) { camTip = tip; camTipSeen = now; }
  // 控制映射：指尖 x = 转向；从下越过 30% 线 = 跳跃
  if (camTip && now - camTipSeen < 400) {
    camDir = camTip.x < 0.36 ? -1 : (camTip.x > 0.64 ? 1 : 0);
    if (!camCrossArmed && camTip.y > 0.60) camCrossArmed = true;
    if (camCrossArmed && camTip.y < 0.30 && state.mode === 'playing') {
      tryJump();
      camCrossArmed = false;
    }
  } else {
    camDir = 0;
  }
  // 预览：镜像视频 + 跳跃线 + 指尖光点
  pctx.save();
  pctx.clearRect(0, 0, pv.width, pv.height);
  pctx.translate(pv.width, 0); pctx.scale(-1, 1);
  pctx.drawImage(camVideo, 0, 0, pv.width, pv.height);
  pctx.restore();
  pctx.strokeStyle = 'rgba(255,255,255,0.85)';
  pctx.setLineDash([4, 4]);
  pctx.beginPath(); pctx.moveTo(0, pv.height * 0.30); pctx.lineTo(pv.width, pv.height * 0.30); pctx.stroke();
  pctx.setLineDash([]);
  pctx.fillStyle = 'rgba(255,255,255,0.7)';
  pctx.font = '9px sans-serif';
  pctx.fillText('↑ 上挑跳跃', 3, pv.height * 0.30 - 4);
  if (camTip && now - camTipSeen < 400) {
    pctx.fillStyle = '#ff3b30';
    pctx.beginPath(); pctx.arc(camTip.x * pv.width, camTip.y * pv.height, 7, 0, Math.PI * 2); pctx.fill();
    pctx.strokeStyle = '#ffffff'; pctx.lineWidth = 2;
    pctx.beginPath(); pctx.arc(camTip.x * pv.width, camTip.y * pv.height, 7, 0, Math.PI * 2); pctx.stroke();
  }
}

function addPetal(x, y, n){
  const cols = ['#ffd1e3', '#ffffff', '#ffb3d1', '#ffe9a8'];

    ps.push({ type:'petal', x:x + (Math.random()-0.5)*24, y:y,
      vx:(Math.random()-0.5)*60, vy:-40-Math.random()*70, grav:70,
      life:1.3, max:1.3, rot:Math.random()*6.28, vr:(Math.random()-0.5)*7,
      seed:Math.random()*6.28, col:cols[(Math.random()*cols.length)|0] });
  }
}
function addDust(x, y, n, dir){
  for (let i = 0; i < n; i++) {
    ps.push({ type:'dust', x:x + (Math.random()-0.5)*30, y:y - Math.random()*10,
      vx:-dir*(20+Math.random()*70), vy:(Math.random()-0.5)*40, grav:0,
      life:0.55, max:0.55, rot:0, vr:0, seed:0, col:'#d9c39a' });
  }
}
function addSparkle(x, y, n){
  for (let i = 0; i < n; i++) {
    ps.push({ type:'spark', x:x, y:y, vx:(Math.random()-0.5)*140, vy:-60-Math.random()*140,
      grav:260, life:0.65, max:0.65, rot:0, vr:0, seed:0,
      col: Math.random() < 0.5 ? '#ffd23f' : '#ffffff' });
  }
}
function addSplash(x, y, n){
  for (let i = 0; i < n; i++) {
    ps.push({ type:'splash', x:x + (Math.random()-0.5)*30, y:y,
      vx:(Math.random()-0.5)*160, vy:-80-Math.random()*160, grav:520,
      life:0.5, max:0.5, rot:0, vr:0, seed:0, col:'#a5dcf7' });
  }
}
function updateParticles(dt){
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.life -= dt;
    if (p.life <= 0) { ps.splice(i, 1); continue; }
    p.x += (p.type === 'petal' ? p.vx + Math.sin(state.t * 6 + p.seed) * 34 : p.vx) * dt;
    p.y += p.vy * dt;
    if (p.grav) p.vy += p.grav * dt;
    p.rot += p.vr * dt;
  }
}
function drawParticles(){
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i], a = p.life / p.max;
    ctx.save();
    if (p.type === 'petal') {
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, a * 1.6);
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'spark') {
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - 4, p.y); ctx.lineTo(p.x + 4, p.y);
      ctx.moveTo(p.x, p.y - 4); ctx.lineTo(p.x, p.y + 4);
      ctx.stroke();
    } else {
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.type === 'splash' ? 3.4 : 4.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ================= 更新逻辑 ================= */
function spawn(){
  while (nextItemX < bear.x + viewW * 1.6) {
    while (inGap(nextItemX)) nextItemX += 80;
    const kind = (spawnCount % 4 === 3) ? 'honey' : 'berry';
    items.push({ type: kind, x: nextItemX, t: Math.random() * 6.28, taken: false });
    nextItemX += (kind === 'honey') ? 1500 + Math.random() * 600 : 420 + Math.random() * 220;
    spawnCount++;
  }
  while (nextRockX < bear.x + viewW * 1.6) {
    while (inGap(nextRockX)) nextRockX += 70;
    rocks.push({ x: nextRockX, r: 24 + Math.random() * 15 });
    nextRockX += (750 + Math.random() * 350) * Math.max(0.55, 1 - playTime * 0.002);
  }
  while (nextPuddleX < bear.x + viewW * 2.0) {
    while (inGap(nextPuddleX)) nextPuddleX += 90;
    puddles.push({ x: nextPuddleX, rx: 80 + Math.random() * 60, ry: 15 + Math.random() * 5 });
    nextPuddleX += 1100 + Math.random() * 600;
  }
  // 沟壑（22 秒后出现）
  if (playTime > 26) {
    if (nextGapX < bear.x + viewW * 0.6) nextGapX = bear.x + viewW * (0.9 + Math.random() * 0.5);
    while (nextGapX < bear.x + viewW * 2.0) {
      const g = { x: nextGapX, w: 100 + Math.random() * 80 };
      gaps.push(g);
      items = items.filter(function(it){ return it.x < g.x - 50 || it.x > g.x + g.w + 50; });
      rocks = rocks.filter(function(rk){ return rk.x < g.x - 60 || rk.x > g.x + g.w + 60; });
      puddles = puddles.filter(function(p){ return p.x < g.x - 70 || p.x > g.x + g.w + 70; });
      nextGapX += (1500 + Math.random() * 800) * Math.max(0.6, 1 - playTime * 0.002);
    }
  }
}

function tryJump(){
  if (state.mode !== 'playing' || bear.falling) return;
  if (bear.airborne) {
    if (coyote > 0) {
      // 土狼时间：离地瞬间仍可起跳
    } else if (bear.jumps < 1) {

function updatePlay(dt){
  playTime += dt;
  const diff = 1 + Math.min(1.2, playTime * 0.008);
  const maxS = MAXS + Math.min(140, playTime * 1.2);
  const dir = getInputDir();
  const slope = clamp(slopeAt(bear.x), -0.6, 0.6);

  // 连击计时与反馈
  comboTime -= dt;
  if (comboTime <= 0) combo = 0;
  comboBreakT = Math.max(0, comboBreakT - dt);
  bear.squash = Math.max(0, bear.squash - dt * 2.5);
  bear.stretch = Math.max(0, bear.stretch - dt * 3);
  bear.starT = Math.max(0, bear.starT - dt);
  bear.magnetT = Math.max(0, bear.magnetT - dt);
  bear.shieldT = Math.max(0, bear.shieldT - dt);
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt; f.y -= 46 * dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  if (toastT > 0) toastT -= dt; else toastTxt = null;

  // 物理
  const spdMul = bear.starT > 0 ? 1.35 : 1;
  bear.vx += dir * ACC * spdMul * dt;
  if (!bear.airborne) {
    bear.vx += slope * 430 * dt;      // 坡道影响
    bear.vx -= bear.vx * 1.15 * dt;   // 地面摩擦
  } else {
    bear.vx -= bear.vx * 0.3 * dt;    // 空中阻力
  }
  let inPuddle = false;
  if (!bear.airborne) {
    for (let i = 0; i < puddles.length; i++) {
      if (Math.abs(bear.x - puddles[i].x) < puddles[i].rx * 0.9) { inPuddle = true; break; }
    }
    if (inPuddle) bear.vx -= bear.vx * 3.2 * dt;
  }
  bear.vx = clamp(bear.vx, -maxS * spdMul, maxS * spdMul);
  bear.x += bear.vx * dt;
  if (bear.x < STARTX) { bear.x = STARTX; if (bear.vx < 0) bear.vx = 0; }
  bear.groundY = terrainY(bear.x);

  // 沟壑：滚进去就结束（留 0.12 秒反应时间，可起跳自救）
  if (!bear.airborne && overGap(bear.x)) {
    bear.airborne = true;
    bear.vy = 0;
    trail.push([]);
  }

  // 跳跃与落地
  coyote = Math.max(0, coyote - dt);
  jumpBuf = Math.max(0, jumpBuf - dt);
  if (bear.airborne) {
    bear.vy += 1350 * dt;
    bear.y += bear.vy * dt;
    if (overGap(bear.x)) bear.overGapT += dt; else bear.overGapT = 0;
    if (bear.overGapT > 0.12 && bear.vy > 0 && bear.y >= bear.groundY - R) bear.falling = true;
    if (!bear.falling && bear.y >= bear.groundY - R && !overGap(bear.x)) {
      bear.y = bear.groundY - R;
      bear.airborne = false;
      bear.vy = 0;
      bear.squash = 0.18;
      bear.jumps = 0;
      sfx('land');
      addDust(bear.x, bear.groundY, 3, Math.sign(bear.vx) || 1);
      trail.push([]);
      if (jumpBuf > 0) tryJump();   // 跳跃缓冲：落地立即起跳
    }
    if (bear.falling && bear.y > bear.groundY + 420) { gameOver('pit'); return; }
  } else {
    bear.y = bear.groundY - R;
    coyote = 0.12;                  // 土狼时间：离地后仍可短暂起跳
  }
  bear.angle += (bear.vx / R) * dt;

  // 体力消耗（四叶草护盾期间不掉体力）
  if (bear.shieldT <= 0) {
    bear.energy -= (2.3 + (Math.abs(bear.vx) > 40 ? 0.5 : 0) + (inPuddle ? 1.5 : 0)) * diff * dt;
  }
  if (bear.energy <= 0) { bear.energy = 0; gameOver('energy'); return; }

  // 低体力心跳警报
  if (bear.energy < 25) {
    heartTimer -= dt;
    if (heartTimer <= 0) { heartTimer = 1.1; sfx('heart'); }
  } else {
    heartTimer = 1.1;
  }

  // 水花与尘土
  if (inPuddle && Math.random() < 0.25) addSplash(bear.x, bear.y - 6, 1);
  if (!bear.airborne && Math.abs(bear.vx) > 260 && Math.random() < 0.5) addDust(bear.x, bear.groundY, 1, Math.sign(bear.vx) || 1);
  // 无敌冲刺彩虹拖尾
  if (bear.starT > 0 && Math.random() < 0.7) {
    const cols = ['#ff5f6d', '#ffc371', '#7ae582', '#6fc3ff', '#d58cff'];
    ps.push({ type:'spark', x:bear.x - R * 0.9, y:bear.y + (Math.random() - 0.5) * R,
      vx:-60, vy:(Math.random() - 0.5) * 60, grav:0, life:0.5, max:0.5, rot:0, vr:0, seed:0,
      col:cols[(Math.random() * 5) | 0] });
  }

  // 石头碰撞（无敌冲刺时直接碾过）
  if (bear.starT <= 0) {
    for (let i = 0; i < rocks.length; i++) {
    const rk = rocks[i];
    const cy = terrainY(rk.x) - rk.r * 0.82;
    const dx = bear.x - rk.x, dy = bear.y - cy;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < R + rk.r * 0.9) {
      const nx = d > 0.01 ? dx / d : -1;
      bear.x = rk.x + nx * (R + rk.r * 0.9);
      bear.vx = -bear.vx * 0.45 + nx * 60;
      bear.energy = Math.max(0, bear.energy - 7);
      comboBreak();
      shake = 9;
      sfx('bump'); vibrate(40);
      addDust(bear.x - nx * R, bear.y + 8, 8, Math.sign(bear.vx) || 1);
      if (bear.energy <= 0) { gameOver('energy'); return; }
    }
  }
  }

  // 滚石（45 秒后迎面滚来）
  boulderTimer -= dt;
  if (boulderTimer <= 0) {
    boulderTimer = 11 + Math.random() * 8;
    if (playTime > 45 && boulders.length < 2) {
      boulders.push({ x: bear.x + viewW * 1.4, r: 34 + Math.random() * 8,
        vx: -(230 + Math.random() * 150 + Math.min(120, playTime * 0.8)), angle: 0 });
    }
  }
  for (let i = boulders.length - 1; i >= 0; i--) {
    const bl = boulders[i];
    bl.x += bl.vx * dt;
    bl.angle += (bl.vx / bl.r) * dt;
    if (bl.x < bear.x - viewW || overGap(bl.x)) { boulders.splice(i, 1); continue; }
    if (bear.starT > 0) continue;   // 无敌冲刺直接穿过
    const cy = terrainY(bl.x) - bl.r * 0.85;
    const dx = bear.x - bl.x, dy = bear.y - cy;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < R + bl.r * 0.9) {
      boulders.splice(i, 1);
      const nx = d > 0.01 ? dx / d : -1;
      bear.vx = -bear.vx * 0.5 + nx * 80;
      bear.energy = Math.max(0, bear.energy - 12);
      comboBreak();
      shake = 10;
      sfx('bump'); vibrate(60);
      addDust(bear.x - nx * R, bear.y + 8, 10, Math.sign(bear.vx) || 1);
      if (bear.energy <= 0) { gameOver('energy'); return; }
    }
  }

  // 道具拾取
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.taken) continue;
    const iy = terrainY(it.x) - 34 + Math.sin(state.simT * 2 + it.t) * 4;
    if (bear.magnetT > 0 && Math.abs(it.x - bear.x) < 300) it.x -= Math.sign(it.x - bear.x) * 260 * dt;
    const dx = bear.x - it.x, dy = bear.y - iy;
    if (Math.abs(dx) < R + 20 && Math.abs(dy) < R + 24) {
      it.taken = true;
      if (it.type === 'honey') {
        bear.energy = Math.min(100, bear.energy + 30);
        honey++;
        stats.totalHoney++;
        comboHit();
        points += 20 * comboMult();
        sfx('honey');
        addSparkle(it.x, iy, 10);
        addFloat(it.x, iy - 28, '+' + (20 * comboMult()), '#ff9d2e');
      } else {
        bear.energy = Math.min(100, bear.energy + 8);
        comboHit();
        points += 5 * comboMult();
        sfx('berry');
        addSparkle(it.x, iy, 6);
        addFloat(it.x, iy - 26, '+' + (5 * comboMult()), '#ff5fa2');
      }
    }
  }

  // 压花
  const fi = Math.round(bear.x / 30);
  if (fi !== lastFi) {
    lastFi = fi;
    if (!bear.airborne && !inGap(fi * 30) && flowerExists(fi) && !picked.has(fi)) {
      picked.add(fi);
      stats.totalFlowers++;
      bear.energy = Math.min(100, bear.energy + 1);
      comboHit();
      points += 1 * comboMult();
      addPetal(fi * 30, terrainY(fi * 30) - 8, 5);
    }
  }

  // 高连击时撒金粉
  if (!bear.airborne && combo >= 5 && Math.random() < 0.3) addSparkle(bear.x - R * 0.8, bear.y + R * 0.6, 1);

  // 滚痕（分段：跳跃/沟壑会断开）
  if (!bear.airborne && Math.abs(bear.vx) > 12) {
    const seg = trail[trail.length - 1];
    const lp = seg[seg.length - 1];
    if (!lp || Math.abs(bear.x - lp.x) > 12) seg.push({ x: bear.x, y: bear.groundY });
  }
  if (!bear.airborne && !overGap(bear.x) && Math.abs(bear.vx) > 30 && Math.random() < 0.5) {
    marks.push({ x: bear.x + (Math.random() - 0.5) * R * 2.2, y: bear.groundY + Math.random() * 6,
      ang: (Math.random() - 0.5) * Math.PI, len: 9 + Math.random() * 9, life: 1 });
  }

  // 蜜蜂（后期最多同时两只）
  const maxBees = playTime > 50 ? 2 : 1;
  if (bees.length < maxBees) {
    beeTimer -= dt;
    if (beeTimer <= 0) {
      beeTimer = Math.max(5, 14 - playTime * 0.05) + Math.random() * 4;
      bees.push({ x: bear.x + viewW * (0.55 + Math.random() * 0.4),
        y: terrainY(bear.x) - 90 - Math.random() * 60, leave: false, leaveT: 0, ph: Math.random() * 6.28 });
    }
  }
  for (let i = bees.length - 1; i >= 0; i--) {
    const b = bees[i];
    if (!b.leave) {
      const sp = 150 + Math.min(170, playTime * 0.8);
      const dx = bear.x - b.x;
      b.x += (dx > 0 ? 1 : -1) * sp * dt;
      const targetY = bear.y * 0.85 + Math.sin(state.simT * 6 + b.ph) * 30;
      b.y += (targetY - b.y) * Math.min(1, 2.5 * dt);
      const d = Math.sqrt((bear.x - b.x) * (bear.x - b.x) + (bear.y - b.y) * (bear.y - b.y));
      if (d < R + 16 && bear.starT <= 0) {
        b.leave = true; b.leaveT = 1.4;
        bear.energy = Math.max(0, bear.energy - 10);
        bear.vx = (bear.x > b.x ? 1 : -1) * 200;
        comboBreak();
        shake = 7;
        sfx('sting'); vibrate(60);
        if (bear.energy <= 0) { gameOver('energy'); return; }
      }
    } else {
      b.leaveT -= dt;
      b.x += (bear.x > b.x ? -1 : 1) * 150 * dt;
      b.y -= 170 * dt;
      if (b.leaveT <= 0) bees.splice(i, 1);
    }
  }

  // 特殊道具（⭐无敌冲刺 / 🧲磁铁 / 🍀四叶草）
  powerTimer -= dt;
  if (powerTimer <= 0) {
    powerTimer = 20 + Math.random() * 10;
    if (powers.length < 1) {
      const types = ['star', 'magnet', 'clover'];
      powers.push({ type: types[(Math.random() * 3) | 0], x: bear.x + viewW * 1.2,
        y: terrainY(bear.x) - 80 - Math.random() * 50, t: Math.random() * 6.28 });
    }
  }
  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i];
    if (p.x < bear.x - viewW) { powers.splice(i, 1); continue; }
    const iy = terrainY(p.x) - 55 + Math.sin(state.simT * 2 + p.t) * 10;
    const dx = bear.x - p.x, dy = bear.y - iy;
    if (Math.abs(dx) < R + 26 && Math.abs(dy) < R + 30) {
      powers.splice(i, 1);
      if (p.type === 'star') { bear.starT = 3.5; sfx('star'); addToast('⭐ 无敌冲刺!'); }
      else if (p.type === 'magnet') { bear.magnetT = 6; sfx('magnet'); addToast('🧲 磁铁吸引!'); }
      else { bear.energy = Math.min(100, bear.energy + 15); bear.shieldT = 5; sfx('clover'); addToast('🍀 幸运四叶草!'); }
      addSparkle(p.x, iy, 12);
    }
  }

  // 蝴蝶（会逃跑的加分彩蛋）
  bflyTimer -= dt;
  if (bflyTimer <= 0) {
    bflyTimer = 14 + Math.random() * 8;
    if (butterflies.length < 2) {
      butterflies.push({ x: bear.x + viewW * 1.1, baseY: terrainY(bear.x) - 110 - Math.random() * 80,
        ph: Math.random() * 6.28, flee: false, taken: false });
    }
  }
  for (let i = butterflies.length - 1; i >= 0; i--) {
    const bf = butterflies[i];
    if (bf.x < bear.x - viewW) { butterflies.splice(i, 1); continue; }
    bf.x -= (bf.flee ? 240 : 55) * dt;
    bf.y = bf.baseY + Math.sin(state.simT * 3 + bf.ph) * 42;
    if (!bf.flee && Math.abs(bf.x - bear.x) < 260) bf.flee = true;
    const d = Math.sqrt((bear.x - bf.x) * (bear.x - bf.x) + (bear.y - bf.y) * (bear.y - bf.y));
    if (!bf.taken && d < R + 22) {
      bf.taken = true;
      comboHit();
      points += 10 * comboMult();
      sfx('bfly');
      addSparkle(bf.x, bf.y, 8);
      addFloat(bf.x, bf.y - 20, '+' + (10 * comboMult()), '#d58cff');
      butterflies.splice(i, 1);
    }
  }

  // 生成与回收
  spawn();
  while (items.length && items[0].x < bear.x - viewW) items.shift();
  while (rocks.length && rocks[0].x < bear.x - viewW) rocks.shift();
  while (puddles.length && puddles[0].x < bear.x - viewW) puddles.shift();
  while (gaps.length && gaps[0].x + gaps[0].w < bear.x - viewW) gaps.shift();
  while (marks.length && marks[0].x < bear.x - viewW * 1.6) marks.shift();
  while (marks.length > 400) marks.shift();
  for (let s = 0; s < trail.length; s++) {
    while (trail[s].length && trail[s][0].x < bear.x - viewW * 1.6) trail[s].shift();
  }
  trail = trail.filter(function(seg){ return seg.length > 0; });
  if (!trail.length) trail.push([]);

  meters = Math.max(0, (bear.x - STARTX) / 48);
  score = Math.floor(meters) + points;
  stats.bestRunMeters = Math.max(stats.bestRunMeters, Math.floor(meters));
  checkAch();
  const mi = Math.floor(meters / 100);
  if (mi > metersMilestone) { metersMilestone = mi; addToast(mi * 100 + ' 米啦! 🎉'); }
  if (!recordShown && state.best > 0 && score > state.best) { recordShown = true; addToast('🏆 打破纪录啦!'); }
  updateHUD();
}

function updateCamera(dt){
  const targetX = bear.x + bear.vx * 0.25 - viewW * 0.42;
  camX += (targetX - camX) * Math.min(1, 6 * dt);
  let targetY;
  if (bear.falling) {
    targetY = bear.y - viewH * 0.55;
  } else {
    targetY = clamp(bear.groundY - viewH * 0.62,
      bear.groundY - viewH * 0.80, bear.groundY - viewH * 0.32);
  }
  camY += (targetY - camY) * Math.min(1, 6 * dt);
  shake = Math.max(0, shake - 34 * dt);
}

/* ================= 绘制 ================= */
function drawSky(){
  const shift = Math.min(1, playTime / 240) * 0.85;
  const g = ctx.createLinearGradient(0, camY, 0, camY + viewH);
  g.addColorStop(0, hexLerp('#8ed0f2', '#ff9e6d', shift));
  g.addColorStop(0.55, hexLerp('#b8e4f7', '#ffc98a', shift));
  g.addColorStop(1, hexLerp('#dff3e8', '#ffe0b8', shift));
  ctx.fillStyle = g;
  ctx.fillRect(camX - 50, camY - 50, viewW + 100, viewH + 120);
}
function drawSun(){
  const sx = camX + viewW - 130, sy = camY + 130;
  const g = ctx.createRadialGradient(sx, sy, 10, sx, sy, 95);
  g.addColorStop(0, 'rgba(255,226,138,0.65)');
  g.addColorStop(1, 'rgba(255,226,138,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(sx, sy, 95, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd873';
  ctx.beginPath(); ctx.arc(sx, sy, 44, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(sx, sy, 34, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c98a2e';
  ctx.beginPath(); ctx.arc(sx - 11, sy - 6, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx + 11, sy - 6, 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#c98a2e'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(sx, sy + 2, 14, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}
function updateClouds(dt){
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    c.x += c.v * dt;
    if (c.x - camX > viewW + 420) c.x = camX - 500 - Math.random() * 400;
  }
}
function drawClouds(){
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < clouds.length; i++) {
    const c = clouds[i];
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 34 * c.s, 16 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 28 * c.s, c.y + 8 * c.s, 26 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x - 30 * c.s, c.y + 10 * c.s, 24 * c.s, 12 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 5 * c.s, c.y - 13 * c.s, 22 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawHillLayer(par, color, amp, freq, baseY){
  const x0 = camX - 40, x1 = camX + viewW + 40;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x0, camY + viewH + 60);
  const off = camX * par;
  for (let x = x0; x <= x1; x += 28) {
    const wx = x * par + off;
    const y = baseY + Math.sin(wx * freq) * amp + Math.sin(wx * freq * 0.37 + 2) * amp * 0.5;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(x1, camY + viewH + 60);
  ctx.closePath();
  ctx.fill();
}
function drawGround(){
  const x0 = camX - 40, x1 = camX + viewW + 40;
  const g = ctx.createLinearGradient(0, camY + viewH * 0.55, 0, camY + viewH + 60);
  g.addColorStop(0, '#79b955');
  g.addColorStop(0.5, '#5da345');
  g.addColorStop(1, '#41792f');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x0, camY + viewH + 60);
  ctx.lineTo(x0, terrainY(x0));
  for (let x = x0; x <= x1; x += 24) {
    let gapHere = false;
    for (let k = 0; k < gaps.length; k++) {
      if (x > gaps[k].x && x < gaps[k].x + gaps[k].w) { gapHere = true; break; }
    }
    if (!gapHere) ctx.lineTo(x, terrainY(x));
  }
  ctx.lineTo(x1, camY + viewH + 60);
  ctx.closePath();
  ctx.fill();
  // 沟壑：深坑与侧壁
  for (let k = 0; k < gaps.length; k++) {
    const gg = gaps[k];
    if (gg.x + gg.w < x0 - 60 || gg.x > x1 + 60) continue;
    const gyL = terrainY(gg.x), gyR = terrainY(gg.x + gg.w);
    const top = Math.min(gyL, gyR), depth = 420;
    ctx.fillStyle = 'rgba(22,34,20,0.88)';
    ctx.fillRect(gg.x, top, gg.w, depth + 60);
    ctx.fillStyle = '#1b2819';
    ctx.fillRect(gg.x - 6, top + depth - 20, gg.w + 12, 20);
    ctx.fillStyle = '#8a6a4a';
    ctx.fillRect(gg.x - 5, gyL, 6, depth);
    ctx.fillRect(gg.x + gg.w - 1, gyR, 6, depth);
  }
}
function drawBlade(i, front){
  const h = hash(i);
  if ((h < 0.5) !== front) return;
  const step = 26;
  const x = i * step + h * 20;
  if (inGap(x)) return;
  const gy = terrainY(x);
  const hgt = 10 + h * 18 + (front ? 5 : 0);
  const sway = Math.sin(state.simT * 2 + i * 0.9) * 2.5;
  const lean = (hash(i * 3 + 1) - 0.5) * 14;
  const cols = ['#5ea043', '#6fae4e', '#4f8f3a', '#7cba5a'];
  ctx.strokeStyle = cols[Math.floor(hash(i * 5 + 2) * 4)];
  ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, gy);
  ctx.quadraticCurveTo(x + lean * 0.4, gy - hgt * 0.6, x + lean + sway, gy - hgt);
  ctx.stroke();
}
function drawFlower(i){
  const x = i * 30 + hash(i * 7 + 1) * 22;
  if (inGap(x)) return;
  const gy = terrainY(x) - 2;
  const cols = ['#ffd1e3', '#ffe9a8', '#ffffff', '#ffb3d1'];
  const col = cols[Math.floor(hash(i * 13 + 5) * 4)];
  const cx = x, cy = gy - 10;
  ctx.strokeStyle = '#4f8f3a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, cy + 4); ctx.stroke();
  for (let k = 0; k < 5; k++) {
    const a = k / 5 * Math.PI * 2;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * 6.5, cy + Math.sin(a) * 5.5, 4.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(cx, cy, 3.6, 0, Math.PI * 2); ctx.fill();
}
function drawTrail(){
  ctx.strokeStyle = 'rgba(47,107,40,0.30)';
  ctx.lineWidth = R * 1.9;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let s = 0; s < trail.length; s++) {
    const seg = trail[s];
    if (seg.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(seg[0].x, seg[0].y);
    for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
    ctx.stroke();
  }
  for (let i = 0; i < marks.length; i++) {
    const m = marks[i];
    if (inGap(m.x)) continue;
    m.life = Math.max(0, m.life - 0.004);
    ctx.strokeStyle = 'rgba(65,121,47,' + (m.life * 0.5) + ')';
    ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(m.x - Math.cos(m.ang) * m.len * 0.5, m.y - Math.sin(m.ang) * m.len * 0.12);
    ctx.lineTo(m.x + Math.cos(m.ang) * m.len * 0.5, m.y + Math.sin(m.ang) * m.len * 0.12);
    ctx.stroke();
  }
}
function drawPuddle(p){
  const g = terrainY(p.x), cy = g - p.ry * 0.3;
  ctx.fillStyle = 'rgba(104,186,238,0.8)';
  ctx.beginPath(); ctx.ellipse(p.x, cy, p.rx, p.ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(70,150,205,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(p.x, cy, p.rx, p.ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.ellipse(p.x - p.rx * 0.3, cy - p.ry * 0.3, p.rx * 0.3, p.ry * 0.26, 0, 0, Math.PI * 2); ctx.fill();
}
function drawRock(rk){
  const g = terrainY(rk.x), cy = g - rk.r * 0.82, r = rk.r;
  ctx.fillStyle = 'rgba(30,60,20,0.18)';
  ctx.beginPath(); ctx.ellipse(rk.x, g, r * 0.9, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#98a0a8';
  ctx.beginPath(); ctx.arc(rk.x, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#6d747b'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(rk.x, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.ellipse(rk.x - r * 0.3, cy - r * 0.35, r * 0.4, r * 0.25, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#6d747b'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rk.x - r * 0.25, cy - r * 0.5); ctx.lineTo(rk.x + r * 0.1, cy - r * 0.1);
  ctx.moveTo(rk.x - r * 0.45, cy + r * 0.3); ctx.lineTo(rk.x + r * 0.3, cy + r * 0.05);
  ctx.stroke();
  ctx.fillStyle = 'rgba(111,174,78,0.85)';
  ctx.beginPath(); ctx.arc(rk.x + r * 0.35, cy + r * 0.45, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(rk.x + r * 0.55, cy + r * 0.2, r * 0.15, 0, Math.PI * 2); ctx.fill();
}
function drawBoulder(bl){

  ctx.strokeStyle = '#4a2f1d'; ctx.lineWidth = 2.2;

function drawWarnings(){
  const ahead = 700;
  // 石头与滚石：头顶红色感叹号
  for (let i = 0; i < rocks.length; i++) {
    const rk = rocks[i];
    if (rk.x < bear.x - 40 || rk.x - bear.x > ahead) continue;
    drawWarnMark(rk.x, terrainY(rk.x) - rk.r * 0.82 - rk.r - 30, '!');
  }
  for (let i = 0; i < boulders.length; i++) {
    const bl = boulders[i];
    if (bl.x < bear.x - 40 || bl.x - bear.x > ahead) continue;
    drawWarnMark(bl.x, terrainY(bl.x) - bl.r * 0.85 - bl.r - 30, '!');
  }
  // 沟壑：跳警示 + 起跳弧线
  for (let i = 0; i < gaps.length; i++) {
    const g = gaps[i];
    if (g.x < bear.x - 60 || g.x - bear.x > ahead) continue;
    const gcx = g.x + g.w / 2;
    drawWarnMark(gcx, Math.min(terrainY(g.x), terrainY(g.x + g.w)) - 60, '跳!');
    // 接近沟壑（480 内、贴地）时显示虚线弧线：从这里起跳
    if (g.x - bear.x > 0 && g.x - bear.x < 480 && !bear.airborne) {
      const sx = bear.x, sy = bear.y - R * 0.4;
      const ex = g.x + g.w + 40, ey = terrainY(ex) - R;
      const mx = (sx + ex) / 2, my = Math.min(sy, ey) - 130;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 3.5;
      ctx.setLineDash([10, 9]);
      ctx.lineDashOffset = -state.t * 60;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(mx, my, ex, ey);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - 12, ey - 8);
      ctx.lineTo(ex - 10, ey + 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
}
function drawWorld(){
  drawSky();
  drawHillLayer(0.30, '#b7d9a3', 120, 0.0011, camY + viewH * 0.56);
  drawHillLayer(0.55, '#93c47d', 80, 0.0018, camY + viewH * 0.66);
  drawSun();
  drawClouds();
  drawGround();

  const i0 = Math.floor((camX - 40) / 26), i1 = Math.floor((camX + viewW + 40) / 26);
  for (let i = i0; i <= i1; i++) drawBlade(i, true);
  const f0 = Math.floor((camX - 40) / 30), f1 = Math.floor((camX + viewW + 40) / 30);
  for (let i = f0; i <= f1; i++) if (flowerExists(i) && !picked.has(i)) drawFlower(i);

  drawTrail();
  for (let i = 0; i < puddles.length; i++) drawPuddle(puddles[i]);
  for (let i = 0; i < rocks.length; i++) drawRock(rocks[i]);
  for (let i = 0; i < boulders.length; i++) drawBoulder(boulders[i]);
  for (let i = 0; i < powers.length; i++) drawPower(powers[i]);
  for (let i = 0; i < items.length; i++) {
    if (items[i].taken) continue;
    if (items[i].type === 'berry') drawBerry(items[i]); else drawHoney(items[i]);
  }
  drawBear();
  // 无敌冲刺光环 / 四叶草护盾环
  if (bear.starT > 0) {
    ctx.strokeStyle = 'rgba(255,215,90,' + (Math.min(1, bear.starT) * (0.5 + 0.3 * Math.sin(state.t * 10))) + ')';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(bear.x, bear.y, R + 9 + Math.sin(state.t * 8) * 3, 0, Math.PI * 2); ctx.stroke();
  }
  if (bear.shieldT > 0) {
    ctx.strokeStyle = 'rgba(120,220,110,' + (Math.min(1, bear.shieldT) * 0.8) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(bear.x, bear.y, R + 7, 0, Math.PI * 2); ctx.stroke();
  }
  for (let i = 0; i < bees.length; i++) drawBee(bees[i]);
  for (let i = 0; i < butterflies.length; i++) drawButterfly(butterflies[i]);
  for (let i = i0; i <= i1; i++) drawBlade(i, false);
  drawParticles();
  if (state.mode === 'playing') drawWarnings();
  for (let i = 0; i < floats.length; i++) {
    const f = floats[i];
    const a = Math.min(1, f.life / f.max * 1.6);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = '900 20px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  // 连击显示
  if (state.mode === 'playing' && combo >= 2) {
    const cx = bear.x, cy = bear.y - R - 34;
    ctx.save();
    ctx.font = '900 24px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const pulse = 1 + Math.sin(state.t * 10) * 0.07;
    ctx.translate(cx, cy); ctx.scale(pulse, pulse);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText('连击 ×' + combo, 0, 0);
    ctx.fillStyle = '#ff6b2e';
    ctx.fillText('连击 ×' + combo, 0, 0);
    ctx.restore();
    const bw = 48;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(cx - bw / 2, cy + 15, bw, 5);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(cx - bw / 2, cy + 15, bw * Math.max(0, comboTime / 3.5), 5);
  }
  if (state.mode === 'playing' && comboBreakT > 0) {
    ctx.font = '900 20px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = Math.min(1, comboBreakT);
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.strokeText('连击中断!', bear.x, bear.y - R - 58);
    ctx.fillStyle = '#d63a3a';
    ctx.fillText('连击中断!', bear.x, bear.y - R - 58);
    ctx.globalAlpha = 1;
  }
}

/* ================= 渲染循环 ================= */
function render(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.scale(scale, scale);
  const shx = shake > 0 ? (Math.random() * 2 - 1) * shake : 0;
  const shy = shake > 0 ? (Math.random() * 2 - 1) * shake : 0;
  ctx.translate(-camX + shx, -camY + shy);
  drawWorld();
  ctx.restore();

  // 鼓励提示
  if (toastTxt && state.mode === 'playing') {
    const p = toastT > 1.7 ? (2.0 - toastT) / 0.3 : (toastT < 0.3 ? toastT / 0.3 : 1);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p));
    ctx.translate(W / 2, H * 0.2);
    ctx.scale(0.8 + 0.2 * Math.min(1, p), 0.8 + 0.2 * Math.min(1, p));
    ctx.font = '900 26px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeText(toastTxt, 0, 0);
    ctx.fillStyle = '#ff5fa2';
    ctx.fillText(toastTxt, 0, 0);
    ctx.restore();
  }

  // 新手提示
  if (state.mode === 'playing' && playTime < 6) {
    const a = clamp(6 - playTime, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * 0.88;
    ctx.font = '700 17px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    rrect(W / 2 - 160, H - 200, 320, 42, 21);
    ctx.fill();
    ctx.fillStyle = '#5a3b1f';
    ctx.fillText('左下 ◀ ▶ 转向 · 右下「跳!」跳跃', W / 2, H - 179);
    ctx.restore();
  }

  // 低体力红晕警报
  if (state.mode === 'playing' && bear.energy < 25 && bear.energy > 0) {
    const a = (25 - bear.energy) / 25 * (0.30 + 0.12 * Math.sin(state.t * 6));
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(255,60,60,0)');
    vg.addColorStop(1, 'rgba(255,40,40,' + a.toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
}
let last = 0;
function frame(now){
  const dt = clamp((now - last) / 1000, 0, 0.033);
  last = now;
  state.t += dt;

  if (state.mode === 'playing') {
    state.simT += dt;
    updatePlay(dt);
  } else if (state.mode === 'menu') {
    state.simT += dt;
    const g = terrainY(bear.x);
    bear.y = g - R + Math.sin(state.t * 1.8) * 2.5;
    bear.angle = Math.sin(state.t * 0.8) * 0.08;
    blinking = (state.t % 3.2) < 0.12;
  } else if (state.mode === 'over') {
    // 世界冻结，粒子继续飘
  }
  if (state.mode !== 'paused') {
    updateClouds(dt);
    updateParticles(dt);
  }
  updateCamera(dt);
  render();
  requestAnimationFrame(frame);
}

/* ================= 流程控制 ================= */
function setMode(mode){
  state.mode = mode;
  document.getElementById('hud').classList.toggle('hidden', mode !== 'playing');
  document.getElementById('btnJump').classList.toggle('hidden', mode !== 'playing');
  document.getElementById('steer').classList.toggle('hidden', mode !== 'playing');
}
function startGame(){
  ensureAudio();
  sfx('start');
  startMusic();
  resetGame();
  eyeMode = 'roll';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  setMode('playing');
  updateHUD();
}
function doPause(){
  if (state.mode !== 'playing') return;
  setMode('paused');
  document.getElementById('pause').classList.remove('hidden');
}
function doResume(){
  ensureAudio();
  document.getElementById('pause').classList.add('hidden');
  setMode('playing');
  startMusic();
  last = performance.now();
}
document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnRestart').addEventListener('click', startGame);
document.getElementById('btnResume').addEventListener('click', doResume);
document.getElementById('btnPause').addEventListener('click', doPause);
let lastJumpAt = 0;
document.getElementById('btnJump').addEventListener('pointerdown', function(e){
  e.preventDefault();
  ensureAudio();
  tryJump();
  lastJumpAt = performance.now();
});
document.getElementById('btnJump').addEventListener('click', function(e){
  e.preventDefault();
  if (performance.now() - lastJumpAt < 500) return;
  ensureAudio();
  tryJump();
});
document.getElementById('btnMute').addEventListener('click', function(){
  muted = !muted;
  try { localStorage.setItem('bearMute', muted ? '1' : '0'); } catch(e){}
  this.textContent = muted ? '🔇' : '🔊';
  if (muted) stopMusic(); else if (state.mode === 'playing') startMusic();
});
document.getElementById('btnCam').addEventListener('click', function(){
  ensureAudio();
  toggleCam();
});
document.getElementById('btnCopy').addEventListener('click', function(){
  const t = '我在《草地打滚的小熊》滚了 ' + lastResult.dist + ' 米，总分 ' + lastResult.total + ' 分！🍯×' + honey + ' 快来挑战我～ 🐻';
  const btn = this;
  function done(){ btn.textContent = '已复制 ✓'; setTimeout(function(){ btn.textContent = '📋 复制成绩，去炫耀!'; }, 2000); }
  function fallback(){
    const ta = document.createElement('textarea');
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch(e2){}
    document.body.removeChild(ta);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done, fallback);
    } else fallback();
  } catch(e){ fallback(); }
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden) { doPause(); stopMusic(); stopCam(); }
});

/* ================= 启动 ================= */
function initMenu(){
  resetGame();
  eyeMode = 'idle';
  setMode('menu');
  const mBest = document.getElementById('menuBest');
  mBest.textContent = state.best > 0 ? '🏆 最高纪录：' + state.best : '来创造你的第一份纪录吧～';
  const mAch = document.getElementById('menuAch');
  mAch.textContent = '🏅 成就 ' + stats.ach.length + '/' + ACH.length + '（' + ACH.filter(function(a){ return stats.ach.indexOf(a.id) < 0; }).length + ' 个待解锁）';
  document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';
}
resize();
initMenu();
requestAnimationFrame(function(n){ last = n; requestAnimationFrame(frame); });
</script>
